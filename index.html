<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Litster Online</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--surface:#141414;--surface2:#1E1E1E;--text:#F5F5F5;--muted:#A1A1AA;--gold:#D4AF37;--gold-soft:rgba(212,175,55,.12);--line:rgba(212,175,55,.3);--ok:#34D399;--bad:#F87171;--on-gold:#0A0A0A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,h3{font-family:Outfit,sans-serif;margin:0;line-height:1.1}
button,input{font:inherit;color:inherit}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:1rem 1.25rem;font-weight:700;font-size:1.05rem;background:var(--gold);color:var(--on-gold);cursor:pointer}
.btn-line{background:transparent;border:2px solid var(--line);color:var(--gold)}
.btn-quiet{background:var(--surface2);color:var(--text)}
.btn:disabled{opacity:.45}
.stack>*+*{margin-top:.75rem}
input[type=text]{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:.75rem;padding:.75rem .9rem;text-transform:uppercase;letter-spacing:.2em;text-align:center;font-weight:800;font-size:1.3rem}
.muted{color:var(--muted)}.small{font-size:.875rem}
.player{padding:.1rem .55rem;border-radius:.5rem;color:#0A0A0A;font-weight:800}
.dot{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;font-weight:800;color:#0A0A0A}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.7rem 1.1rem;border-radius:999px;font-weight:700;z-index:60}
.hidden{display:none!important}
/* Handy */
.wrap{max-width:30rem;margin:0 auto;padding:1.25rem 1rem 2rem}
.card{display:flex;align-items:center;gap:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.7rem .9rem}
.card .yr{font-family:Outfit,sans-serif;font-weight:900;font-size:1.6rem;color:var(--gold);min-width:3.6rem}
.card .t{font-weight:700;line-height:1.25}.card .a{color:var(--muted);font-size:.85rem}
.slot{display:block;width:100%;border:2px dashed var(--line);background:transparent;border-radius:.9rem;padding:.55rem;margin:.4rem 0;color:var(--muted);font-weight:700;font-size:.9rem;cursor:pointer}
.slot[aria-pressed=true]{border-style:solid;border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.tl{list-style:none;margin:0;padding:0}
.mystery{display:flex;align-items:center;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:1.25rem;padding:1rem;margin-bottom:1rem}
.play{width:4.25rem;height:4.25rem;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;flex:none;border:0;font-size:1.6rem;cursor:pointer}
.q{font-family:Outfit,sans-serif;font-weight:900;font-size:2rem;letter-spacing:.1em;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:flex;align-items:center;gap:.5rem;background:var(--surface2);border:0;border-radius:999px;padding:.4rem .9rem .4rem .4rem;color:var(--text);cursor:pointer;font-weight:700}
/* Fernseher */
.tv{height:100%;display:flex;flex-direction:column;padding:2vh 2vw;gap:1.5vh}
.tv-head{display:flex;align-items:center;gap:2vw}
.tv-head h1{font-size:4vh;font-weight:900;letter-spacing:-.03em}
.tv-head .code{margin-left:auto;font-family:Outfit,sans-serif;font-size:3vh;color:var(--gold);font-weight:900;letter-spacing:.2em}
.tv-head .url{font-size:2vh;color:var(--muted)}
.tv-status{font-size:3.2vh;text-align:center;padding:1.2vh;border-radius:2vh;background:var(--surface);border:1px solid var(--line)}
.lanes{flex:1;display:grid;gap:1.5vh;min-height:0;grid-auto-rows:minmax(0,1fr)}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:2vh;padding:1.5vh 2vh;display:flex;flex-direction:column;min-height:0}
.lane.now{border-color:var(--gold);box-shadow:0 0 0 .5vh var(--gold-soft)}
.lane-head{display:flex;align-items:center;gap:1.5vh;font-size:2.6vh;font-weight:800;margin-bottom:1vh}
.lane-head .cnt{margin-left:auto;font-family:Outfit,sans-serif;font-weight:900;color:var(--gold)}
.strip{display:flex;gap:1vh;overflow-x:auto;align-items:stretch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tcard{flex:0 0 auto;width:15vh;background:var(--surface2);border-radius:1.5vh;padding:1.2vh;display:flex;flex-direction:column;justify-content:space-between}
.tcard .yr{font-family:Outfit,sans-serif;font-weight:900;font-size:3.6vh;color:var(--gold)}
.tcard .t{font-weight:700;font-size:1.7vh;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tcard .a{color:var(--muted);font-size:1.4vh;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tcard.new{outline:.4vh solid var(--ok)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:4vh}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:3vh;padding:4vh 6vh;text-align:center;max-width:90vw}
.verdict{font-size:7vh;font-weight:900;font-family:Outfit,sans-serif}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.reveal{margin-top:2vh}.reveal .t{font-size:3.5vh;font-weight:800}.reveal .a{font-size:2.5vh;color:var(--muted)}.reveal .yr{font-family:Outfit,sans-serif;font-weight:900;font-size:9vh;color:var(--gold)}
.big{font-size:5vh;text-align:center;font-weight:900;font-family:Outfit,sans-serif}
@media (max-width:700px){.tv-head h1{font-size:1.6rem}.tv-status{font-size:1rem}.lane-head{font-size:1rem}.tcard{width:6rem}.tcard .yr{font-size:1.4rem}.tcard .t,.tcard .a{font-size:.7rem}.tv-head .code{font-size:1.2rem}.tv-head .url{font-size:.8rem}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
"use strict";
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const K="litster-online";let L={};try{L=JSON.parse(localStorage.getItem(K)||"{}");}catch(e){}
const saveL=()=>{try{localStorage.setItem(K,JSON.stringify(L));}catch(e){}};
const qs=new URLSearchParams(location.search);
if(qs.get("room"))L.room=qs.get("room").toUpperCase();
let mode=location.hash==="#tv"?"tv":location.hash==="#play"?"play":(L.mode||"");
let state=null,ws=null,conn="off",picked=null,hostOnline=false;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hidden"),2500);}

function connect(){
  if(!L.room)return;
  if(ws){try{ws.onclose=null;ws.close();}catch(e){}}
  conn="connecting";render();
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen=()=>{ws.send(JSON.stringify({type:"join",room:L.room,role:"client"}));};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==="joined"){conn="on";hostOnline=!!m.hasHost;render();}
    else if(m.type==="state"){state=m.state;hostOnline=true;render();}
    else if(m.type==="hostgone"){hostOnline=false;render();}
    else if(m.type==="error"){toast(m.msg);}};
  ws.onclose=()=>{conn="off";render();setTimeout(connect,3000);};
}
function act(action,extra){if(!ws||ws.readyState!==1)return toast("Keine Verbindung");ws.send(JSON.stringify({type:"action",action:Object.assign({a:action},extra||{}),player:L.player||""}));}

function render(){
  if(!L.room||!mode)return $.innerHTML=landing();
  location.hash=mode==="tv"?"#tv":"#play";
  if(mode==="tv")return $.innerHTML=tv();
  $.innerHTML=play();bind();
}
function landing(){
  setTimeout(()=>{
    const go=m=>{const c=document.getElementById("code").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length<4)return toast("Code eingeben (steht in der Litster-App).");L.room=c;mode=m;L.mode=m;saveL();connect();render();};
    document.getElementById("tv").onclick=()=>go("tv");document.getElementById("pl").onclick=()=>go("play");
  });
  return `<div class="wrap stack" style="padding-top:3rem;text-align:center">
    <h1 style="font-size:3rem;font-weight:900">Litster</h1><p class="muted">Raumcode aus der Litster-App eingeben</p>
    <input id="code" type="text" maxlength="6" placeholder="ABCD" value="${esc(L.room||"")}" autocomplete="off">
    <button class="btn" id="pl">Mitspielen (Handy)</button>
    <button class="btn btn-line" id="tv">Spielbrett anzeigen (Fernseher)</button>
  </div>`;
}
const dot=p=>`<span class="dot" style="background:${p.color}">${esc(p.name[0].toUpperCase())}</span>`;
function statusText(s){
  const p=s.players[s.turn];
  if(s.over)return "Spiel vorbei";
  const au={loading:"Song wird gestartet …",playing:"♪ Song läuft",ad:"Gleich geht's los …",paused:"Song pausiert"}[s.audio]||"";
  return `<span class="player" style="background:${p.color}">${esc(p.name)}</span> ist dran ${au?" · "+au:""}`;
}
function tv(){
  if(!state)return `<div class="tv"><div class="tv-head"><h1>Litster</h1><span class="code">${esc(L.room)}</span></div><div class="big" style="margin:auto">${conn==="on"?(hostOnline?"Warte auf Spielstart …":"Die Litster-App ist nicht verbunden. In der App „Online-Raum“ öffnen."):"Verbinde …"}</div></div>`;
  const s=state,n=s.players.length,cols=n<=2?1:n<=4?2:3;
  const r=[...s.players].sort((a,b)=>b.cards.length-a.cards.length);
  return `<div class="tv">
    <div class="tv-head"><h1>Litster</h1><span class="muted" style="font-size:2vh">Runde ${s.round} · Ziel ${s.target} Karten</span><span class="code">${esc(L.room)}<div class="url">${esc(location.host)}</div></span></div>
    ${s.over?`<div class="tv-status">🏆 <b>${esc(r[0].name)}</b> gewinnt mit ${r[0].cards.length} Karten!</div>`:`<div class="tv-status">${statusText(s)}</div>`}
    <div class="lanes" style="grid-template-columns:repeat(${cols},1fr)">${s.players.map((p,i)=>`<div class="lane ${i===s.turn&&!s.over?"now":""}"><div class="lane-head">${dot(p)}${esc(p.name)}${p.jokers?` <span class="muted">🃏${p.jokers}</span>`:""}<span class="cnt">${p.cards.length}/${s.target}</span></div>
      <div class="strip">${p.cards.map(c=>`<div class="tcard ${s.last&&s.last.ok&&s.last.player===p.name&&s.last.song.title===c.title?"new":""}"><div class="yr">${c.year}</div><div><div class="t">${esc(c.title)}</div><div class="a">${esc(c.artist)}</div></div></div>`).join("")}</div></div>`).join("")}</div>
    ${s.last?`<div class="ov"><div class="sheet"><div class="verdict ${s.last.ok?"ok":"bad"}">${s.last.ok?"Richtig!":"Daneben!"}</div><div class="reveal"><div class="t">${esc(s.last.song.title)}</div><div class="a">${esc(s.last.song.artist)}</div><div class="yr">${s.last.song.year}</div></div>${s.last.ok&&!s.last.jokerAsked?`<div class="muted" style="font-size:2.2vh">Hat ${esc(s.last.player)} auch Titel und Interpret gewusst? → Joker</div>`:""}</div></div>`:""}
  </div>`;
}
function play(){
  if(!state)return `<div class="wrap stack" style="text-align:center;padding-top:3rem"><h2>Raum ${esc(L.room)}</h2><p class="muted">${conn==="on"?(hostOnline?"Warte auf Spielstart …":"Die Litster-App ist nicht verbunden."):"Verbinde …"}</p><button class="btn btn-quiet" id="leave">Anderer Raum</button></div>`;
  const s=state;
  if(!L.player||!s.players.some(p=>p.name===L.player))return `<div class="wrap stack"><h2>Wer bist du?</h2><div class="chips">${s.players.map(p=>`<button class="chip" data-pick="${esc(p.name)}">${dot(p)}${esc(p.name)}</button>`).join("")}</div><button class="btn btn-quiet" id="leave">Anderer Raum</button></div>`;
  const me=s.players.find(p=>p.name===L.player),cur=s.players[s.turn],mine=cur.name===me.name&&!s.over;
  if(!mine||s.last)picked=null;
  const r=[...s.players].sort((a,b)=>b.cards.length-a.cards.length);
  if(s.over)return `<div class="wrap stack" style="text-align:center;padding-top:3rem"><h2>${esc(r[0].name)} gewinnt!</h2><p class="muted">Du: ${me.cards.length} Karten</p><button class="btn btn-quiet" id="leave">Anderer Raum</button></div>`;
  if(s.last&&s.last.player===me.name){
    return `<div class="wrap stack" style="text-align:center;padding-top:2rem"><div class="verdict ${s.last.ok?"ok":"bad"}" style="font-size:2.5rem">${s.last.ok?"Richtig!":"Daneben!"}</div><div><b style="font-size:1.2rem">${esc(s.last.song.title)}</b><div class="muted">${esc(s.last.song.artist)}</div><div class="yr" style="font-family:Outfit;font-weight:900;font-size:2.4rem;color:var(--gold)">${s.last.song.year}</div></div>
      ${s.last.ok&&!s.last.jokerAsked?`<p>Hast du auch Titel und Interpret gewusst?</p><div style="display:flex;gap:.6rem"><button class="btn" data-act="jokerAnswer" data-yes="1">Ja, +1 Joker</button><button class="btn btn-quiet" data-act="jokerAnswer" data-yes="0">Nein</button></div>`:`<button class="btn" data-act="next">Nächster Zug</button>`}</div>`;
  }
  if(!mine)return `<div class="wrap stack" style="text-align:center;padding-top:2rem"><p class="muted">Du bist ${esc(me.name)} · ${me.cards.length}/${s.target} Karten${me.jokers?` · 🃏${me.jokers}`:""}</p><h2><span class="player" style="background:${cur.color}">${esc(cur.name)}</span> ist dran</h2><p class="muted">${s.last?"Ergebnis wird angezeigt …":"Warte, bis du dran bist."}</p>
    <ul class="tl">${me.cards.map(c=>`<li class="card"><span class="yr">${c.year}</span><span><div class="t">${esc(c.title)}</div><div class="a">${esc(c.artist)}</div></span></li>`).join("")}</ul><button class="btn btn-quiet" id="leave" style="margin-top:1rem">Anderer Raum</button></div>`;
  const playing=s.audio==="playing"||s.audio==="ad",hint={loading:"Song wird gestartet …",playing:"Läuft. Hör gut hin!",ad:"Gleich geht's los …",paused:"Pausiert.",missing:"Song spielt nicht. Überspringen.",error:"Song spielt nicht. Überspringen."}[s.audio]||"Tipp auf Play, der Song läuft über das Host-Handy.";
  const slot=i=>`<button class="slot" data-slot="${i}" aria-pressed="${picked===i}">${picked===i?"Hier ablegen":"＋ hier einsortieren"}</button>`;
  let items=slot(0);me.cards.forEach((c,i)=>{items+=`<li class="card"><span class="yr">${c.year}</span><span><div class="t">${esc(c.title)}</div><div class="a">${esc(c.artist)}</div></span></li>`+slot(i+1);});
  return `<div class="wrap">
    <h2 style="text-align:center;margin-bottom:1rem"><span class="player" style="background:${me.color}">${esc(me.name)}</span>, du bist dran</h2>
    <div class="mystery"><button class="play" data-act="play">${playing?"❚❚":"▶"}</button><div><div class="q">? ? ? ?</div><div class="small muted">${hint}</div></div></div>
    <p class="small muted" style="margin:0 0 .5rem">Stelle antippen, zum Ablegen nochmal tippen. Oben ist alt, unten ist neu.</p>
    <ul class="tl">${items}</ul>
    <div class="stack" style="margin-top:1rem"><button class="btn btn-line" data-act="joker" ${me.jokers?"":"disabled"}>🃏 Joker: Song skippen (${me.jokers} übrig)</button>
    <button data-act="skip" class="small" style="background:none;border:0;color:var(--muted);text-decoration:underline;width:100%;padding:.25rem">Spielt nicht ab? Technisch überspringen</button></div>
  </div>`;
}
function bind(){
  const lv=document.getElementById("leave");if(lv)lv.onclick=()=>{L.room="";L.player="";mode="";L.mode="";saveL();state=null;render();};
  $.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{L.player=b.dataset.pick;saveL();render();});
  $.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;act(a,a==="jokerAnswer"?{yes:b.dataset.yes==="1"}:{});});
  $.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{const i=+b.dataset.slot;if(picked===i){act("place",{slot:i});picked=null;return;}picked=i;
    $.querySelectorAll("[data-slot]").forEach(x=>{const on=+x.dataset.slot===i;x.setAttribute("aria-pressed",on);x.textContent=on?"Hier ablegen":"＋ hier einsortieren";});});
}
render();if(L.room&&mode)connect();
</script>
</body>
</html>
